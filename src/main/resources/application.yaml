spring:
  application:
    name: book-lending
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/book_lending}
    username: ${SPRING_DATASOURCE_USERNAME:book_lending_user}
    password: ${SPRING_DATASOURCE_PASSWORD:book_lending_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-prod-this-is-a-development-default-only-32-chars-min}
    ttl-minutes: ${JWT_TTL_MINUTES:60}
  borrowing:
    max-active-loans-per-member: ${BORROWING_MAX_ACTIVE_LOANS:3}
    loan-duration-days: ${BORROWING_LOAN_DURATION_DAYS:14}
  seed:
    admin:
      username: ${SEED_ADMIN_USERNAME:admin}
      password: ${SEED_ADMIN_PASSWORD:admin123}
    member:
      email: ${SEED_MEMBER_EMAIL:member@example.com}
      name: ${SEED_MEMBER_NAME:Demo Member}
      password: ${SEED_MEMBER_PASSWORD:member123}

springdoc:
  swagger-ui:
    tagsSorter: alpha

management:
  endpoint:
    health.show-details: always
