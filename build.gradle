plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'org.asciidoctor.jvm.convert' version '4.0.0'
    id 'jacoco'
}

group = 'io.github.mabdulloh'
version = '0.0.1-SNAPSHOT'

configurations {
    asciidoctorExtensions
    testRuntimeClasspath {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.testcontainers') {
                details.useVersion '1.21.3'
                details.because 'Newer Testcontainers ships with Docker API client that supports daemon API >= 1.40'
            }
            if (details.requested.group == 'com.github.docker-java') {
                details.useVersion '3.7.1'
                details.because 'Upgrades bundled Docker API client from 1.32 (too old) to current'
            }
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot starters (from Initializr)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Database
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    //lombok
    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'

    // Tests
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
    testImplementation 'org.springframework.restdocs:spring-restdocs-core'
    testCompileOnly 'org.projectlombok:lombok:1.18.48'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.48'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    asciidoctorExtensions 'org.springframework.restdocs:spring-restdocs-asciidoctor:3.0.1'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'api.version', '1.43'
}

tasks.register('copySnippets', Copy) {
    from layout.buildDirectory.dir('generated-snippets')
    into layout.projectDirectory.dir('src/docs/asciidoc/snippets')
    doFirst {
        delete layout.projectDirectory.dir('src/docs/asciidoc/snippets')
    }
}

asciidoctor {
    sourceDir = file("${projectDir}/src/docs/asciidoc")
    sources {
        include 'index.adoc'
    }
    outputDir = file("${buildDir}/docs/asciidoctor")
    attributes([
        revnumber: project.version,
        revdate: new Date().format('yyyy-MM-dd'),
        sourceHighlighter: 'highlightjs'
    ])
    dependsOn copySnippets
}

tasks.register('asciidoctorFull') {
    dependsOn 'test', 'asciidoctor'
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
    }
}